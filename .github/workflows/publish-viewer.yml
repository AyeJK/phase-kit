# Publishes viewer/ to npm when a push to main carries a version that isn't on
# npm yet. Bump with `npm version patch --no-git-tag-version` in viewer/ and
# push; pushes without a bump run nothing past the version check.
#
# Auth is npm trusted publishing (OIDC): the phase-viewer package on npmjs.com
# must list AyeJK/phase-runner with workflow file publish-viewer.yml.
name: Publish viewer

on:
  push:
    branches: [main]
    paths:
      - 'viewer/**'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: publish-viewer
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: viewer
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: npm
          cache-dependency-path: viewer/package-lock.json

      # Trusted publishing needs npm 11.5.1 or later.
      - run: npm install -g npm@latest

      - name: Check whether this version is already on npm
        id: version
        run: |
          version=$(node -p "require('./package.json').version")
          published=$(npm view "phase-viewer@$version" version 2>/dev/null || true)
          if [ -n "$published" ]; then
            echo "phase-viewer@$version is already on npm; nothing to publish."
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "phase-viewer@$version is new; publishing."
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.version.outputs.publish == 'true'
        run: npm ci

      # prepublishOnly runs `npm run check` and `npm run build` first.
      - if: steps.version.outputs.publish == 'true'
        run: npm publish
